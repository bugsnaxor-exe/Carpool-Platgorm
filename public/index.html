<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Carpooling Platform</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet OpenStreetMap CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Custom CSS Styles -->
  <link rel="stylesheet" href="/css/styles.css">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leaflet OpenStreetMap JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Dynamic Google Maps JS API Loader -->
  <script src="/maps-loader.js"></script>
</head>
<body>
  <div id="root">
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAF7F2; color: #0D6E42; font-family: sans-serif;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.2rem; margin-bottom: 14px;"></i>
      <div style="font-weight: 800; font-size: 1.15rem;">Loading Carpool Platform...</div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error('GLOBAL ERROR:', msg, url, lineNo, error);
      var root = document.getElementById('root');
      if (root && root.innerHTML.indexOf('Loading Carpool') !== -1) {
        root.innerHTML = '<div style="padding:30px; color:#c0392b; font-family:sans-serif; text-align:center;"><h3>App Loading Notice</h3><p>' + msg + '</p><button onclick="location.reload()" style="padding:8px 16px; background:#0D6E42; color:#fff; border:none; border-radius:8px; cursor:pointer;">Refresh Page</button></div>';
      }
      return false;
    };
  </script>

  <!-- Modular React Component Scripts -->
  <script type="text/babel" src="/js/components/SplashScreen.jsx"></script>
  <script type="text/babel" src="/js/components/AuthScreen.jsx"></script>
  <script type="text/babel" src="/js/components/FindRideView.jsx"></script>
  <script type="text/babel" src="/js/components/OfferRideView.jsx"></script>
  <script type="text/babel" src="/js/components/LiveTrackingView.jsx"></script>
  <script type="text/babel" src="/js/components/MyTripsView.jsx"></script>
  <script type="text/babel" src="/js/components/WalletView.jsx"></script>
  <script type="text/babel" src="/js/components/VehicleManagerView.jsx"></script>
  <script type="text/babel" src="/js/components/AdminConsole.jsx"></script>

  <!-- Root App Shell Script -->
  <script type="text/babel" src="/js/app.jsx"></script>
</body>
</html>
